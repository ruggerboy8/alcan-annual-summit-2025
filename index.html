<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Alcan · The Summit 2026 · Austin, TX</title>
    <meta name="description" content="The annual gathering for the Alcan network. December 10–11, 2026 at Texas Old Town in Kyle, just south of Austin, TX. Two days of hands-on CE, real conversations between practices, and time to celebrate." />
    <meta name="author" content="ALCAN Dental Cooperative" />
    <link rel="canonical" href="https://alcansummit.com/" />
    <meta name="theme-color" content="#113B62" />

    <!-- Icons -->
    <link rel="icon" href="/lovable-uploads/82374b29-73bd-4e68-9f6b-b308fae3a74d.png" type="image/png">
    <link rel="apple-touch-icon" href="/lovable-uploads/82374b29-73bd-4e68-9f6b-b308fae3a74d.png">

    <!-- Social. These MUST be absolute URLs: Facebook, LinkedIn, iMessage and
         Slack will not resolve a root-relative og:image, which is why shared
         links previously rendered as a bare text card with no picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alcan · The Summit" />
    <meta property="og:url" content="https://alcansummit.com/" />
    <meta property="og:title" content="Alcan · The Summit 2026" />
    <meta property="og:description" content="The annual gathering for the Alcan network. December 10–11, 2026 near Austin, TX." />
    <meta property="og:image" content="https://alcansummit.com/lovable-uploads/hero-poster.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1076" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alcan · The Summit 2026" />
    <meta name="twitter:description" content="The annual gathering for the Alcan network. December 10–11, 2026 near Austin, TX." />
    <meta name="twitter:image" content="https://alcansummit.com/lovable-uploads/hero-poster.jpg" />

    <!-- Event structured data. This is what lets Google show the dates and venue
         directly in results for an event, rather than just a page title. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "Alcan · The Summit 2026",
      "description": "The annual gathering for every member of the Alcan network — doctors, coordinators, managers and front-desk teams. Two days of hands-on continuing education, conversation between practices, and celebration.",
      "startDate": "2026-12-10T09:00:00-06:00",
      "endDate": "2026-12-11",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "image": ["https://alcansummit.com/lovable-uploads/hero-poster.jpg"],
      "url": "https://alcansummit.com/",
      "location": {
        "@type": "Place",
        "name": "Texas Old Town",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1205 Roland Ln",
          "addressLocality": "Kyle",
          "addressRegion": "TX",
          "postalCode": "78640",
          "addressCountry": "US"
        }
      },
      "organizer": {
        "@type": "Organization",
        "name": "ALCAN Dental Cooperative",
        "url": "https://alcansummit.com/"
      }
    }
    </script>

    <!-- Public Sans = brand text face. IBM Plex Mono = brand metadata face.
         Biondi Sans (display) is self-hosted from src/index.css — it is not a
         Google font, and requesting it here returned HTTP 400 and fell back to serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
